[project]
name = "ecoloop-backend"
version = "0.1.0"
description = "EcoLoop Backend API built with FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "firebase-admin>=6.5,<8",
    "google-adk>=2.12,<3",
    "tzdata==2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

