# Firebase App Hosting Configuration for Next.js 15
runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://ecoloop-backend-project-7eb2c8c6.a.run.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_DEMO_MODE
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: NODE_ENV
    value: production
