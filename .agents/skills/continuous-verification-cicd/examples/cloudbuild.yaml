# Google Cloud Build Configuration for EcoLoop
steps:
  # Step 1: Run Python domain evaluations and unit checks
  - name: 'python:3.12-slim'
    id: 'verify-domain-assertions'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install uv
        uv pip install --system -r backend/requirements.txt
        python .agents/skills/ecoloop-domain-engine/examples/eval_runner.py

  # Step 2: Build container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ecoloop-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ecoloop-backend:latest'
      - 'backend/'

  # Step 3: Push image to Google Artifact Registry / GCR
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ecoloop-backend:$COMMIT_SHA'

  # Step 4: Deploy to Cloud Run with zero-downtime revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ecoloop-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ecoloop-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,GCP_PROJECT_ID=$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/ecoloop-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ecoloop-backend:latest'

timeout: '900s'
